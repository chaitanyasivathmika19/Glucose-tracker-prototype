<style>

t-size:17px;margin:0}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#8c96a2;font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:14px 12px;border-bottom:1px solid #f0f2f5}.table tr:last-child td{border-bottom:0}.table-wrap{overflow-x:auto}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;font-weight:700;color:#687583}.field input,.field select,.field textarea{border:1px solid #dfe5eb;border-radius:10px;padding:12px;background:#fff;color:var(--ink);width:100%;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#69b9b1;box-shadow:0 0 0 3px #178b8314}.field small{font-size:10px;color:var(--muted)}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.notice{padding:12px 14px;border-radius:12px;background:#fff6df;color:#8c6a25;font-size:11px;line-height:1.6;margin:14px 0}.notice.info{background:#eaf7f5;color:#277d75}.notice.error{background:#fff0eb;color:#b65e4c}.notice.success{background:#e7f7ef;color:#247d62}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;background:transparent;padding:10px 12px;color:#778391;font-size:12px;border-bottom:2px solid transparent}.tabs button.active{color:var(--teal);border-color:var(--teal);font-weight:800}.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.plan{border:1px solid var(--line);border-radius:15px;padding:18px;position:relative}.plan.selected{border:2px solid var(--teal);background:#f7fcfb;padding:17px}.plan h3{font-size:13px;margin:0 0 10px}.plan .price{font-size:26px;font-weight:800;letter-spacing:-.8px}.plan p{font-size:11px;color:var(--muted);line-height:1.6}.plan button{width:100%;margin-top:9px}.qr{width:150px;height:150px;margin:10px auto;border:1px dashed #bdc8d2;border-radius:12px;display:grid;place-items:center;background:repeating-conic-gradient(#fff 0% 25%,#f0f3f6 0% 50%) 50% / 16px 16px;color:#687583;font-size:11px;text-align:center;padding:15px}.chat-layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:460px}.chat-list{border-right:1px solid var(--line);padding-right:14px}.chat-person{display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:11px;cursor:pointer}.chat-person.active,.chat-person:hover{background:#eef8f6}.chat-window{display:flex;flex-direction:column;padding-left:18px;min-height:420px}.chat-header{display:flex;align-items:center;gap:10px;padding:0 0 14px;border-bottom:1px solid var(--line)}.messages{display:flex;flex-direction:column;gap:10px;padding:18px 0;flex:1}.bubble{max-width:75%;padding:11px 13px;border-radius:14px;background:#f0f3f7;font-size:12px;line-height:1.6;align-self:flex-start}.bubble.mine{align-self:flex-end;background:#e1f4f0}.bubble small{display:block;font-size:9px;color:#7b8793;margin-top:5px}.chat-compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:13px}.chat-compose input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px}.notif{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #edf0f3}.notif:last-child{border-bottom:0}.notif-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#e5f5f2;flex-shrink:0}.notif h4{font-size:12px;margin:0 0 5px}.notif p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}.notif.unread h4:after{content:'NEW';font-size:8px;color:var(--teal);margin-left:8px}.notif time{font-size:10px;color:#9aa3ad;display:block;margin-top:5px}.toast{position:fixed;bottom:22px;right:22px;background:#202a35;color:white;padding:13px 17px;border-radius:12px;box-shadow:0 12px 30px #0002;font-size:12px;z-index:10;animation:up .2s eas @media(max-width:1100px){.sidebar{width:215px}.main{margin-left:215px;padding:24px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-two{grid-template-columns:1fr}.doctor-list{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">♥</div><span class="brand-text">sweety<span style="color:var(--teal)">.</span></span></div>
  <div class="nav-label">WORKSPACE</div>
  <nav class="nav" id="nav"></nav>
  <div class="side-bottom"><div class="nav-label">ACCOUNT</div><nav class="nav"><button data-page="profile"><span class="ico">⚙</span><span class="navtext">Profile settings</span></button></nav>
  <div class="profile-mini"><div class="avatar teal" id="miniAvatar">CS</div><div class="profile-text"><b id="miniName" style="font-size:12px">Chaitanya S.</b><div class="small" id="miniRole">Patient account</div></div></div></div>
</aside>
<main class="main">
<header class="topbar"><div><div class="crumb">Workspace / <span id="crumbPage">Overview</span></div><h1 class="page-title" id="pageTitle">Patient dashboard</h1></div><div class="top-actions"><div class="role-switch"><button class="selected" data-role="patient">Patient view</button><button data-role="doctor">Doctor view</button></div><button class="iconbtn" data-page="notifications" title="Notifications">♧<span class="dot"></span></button><div class="avatar" id="topAvatar">CS</div></div></header>
<div id="content"></div><div class="footer-note">SWEETY UI/UX PROTOTYPE · DEMO DATA ONLY · NOT FOR MEDICAL DECISION-MAKING</div>
</main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={role:'patient',page:'dashboard',selectedDate:todayISO(),readings:{},editingId:null,plan:null,notificationsRead:false,chatUnlocked:true,subscription:'Active',chat:[{who:'them',text:'Hi Chaitanya! I reviewed your latest readings. How have you been feeling this week?',time:'10:32 AM'},{who:'mine',text:'Hello doctor, I have been tracking my readings every day.',time:'10:35 AM'},{who:'them',text:'Great. Keep recording consistently and we can discuss the trend at your consultation.',time:'10:36 AM'}],doctorTab:'pending',calMonth:new Date()};
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(iso){if(!iso)return '';return new Date(iso+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function isToday(iso){return iso===todayISO()}function timeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
const slots=[{id:'morning',name:'Morning (fasting)',icon:'☀',time:'Before breakfast'},{id:'breakfast',name:'After breakfast',icon:'☕',time:'After your morning meal'},{id:'lunch',name:'After lunch',icon:'🍽',time:'After your afternoon meal'},{id:'dinner',name:'After dinner',icon:'🌙',time:'After your evening meal'}];
// Demonstration records are clearly marked as sample data. Current date is populated for prototype interactions.
state.readings[todayISO()]={morning:{value:108,createdAt:Date.now()-60*60*1000,updatedAt:Date.now()-60*60*1000},breakfast:{value:142,createdAt:Date.now()-2*60*60*1000,updatedAt:Date.now()-2*60*60*1000}};
const patientNav=[['dashboard','▦','Overview'],['tracking','＋','Glucose tracking'],['calendar','▦','Calendar'],['analytics','⌁','Charts & statistics'],['reports','▤','Reports & exports'],['doctors','✚','Find a doctor'],['subscriptions','◇','My consultation'],['chat','▤','Messages'],['notifications','♧','Notifications']];
const doctorNav=[['doctorDashboard','▦','Overview'],['patients','♙','My patients'],['doctorRequests','◷','Requests & payments'],['doctorChat','▤','Messages'],['notifications','♧','Notifications']];
const titles={dashboard:'Patient dashboard',tracking:'Glucose tracking',calendar:'Tracking calendar',analytics:'Charts & statistics',reports:'Reports & exports',doctors:'Find a doctor',subscriptions:'My consultation',chat:'Messages',notifications:'Notifications',profile:'Profile settings',doctorDashboard:'Doctor dashboard',patients:'Authorized patients',doctorRequests:'Requests & payments',doctorChat:'Patient messages'};
function navRender() {const arr=state.role==='patient'?patientNav:doctorNav;$('#nav').innerHTML=arr.map(([id,ico,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}"><span class="ico">${ico}</span><span class="navtext">${label}</span></button>`).join('');$$('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));}
function go(page){state.page=page;render()}
function setRole(role){state.role=role;state.page=role==='patient'?'dashboard':'doctorDashboard';render();toast(role==='patient'?'Patient view selected':'Doctor view selected')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2700)}
function countFor(date){return Object.keys(state.readings[date]||{}).length}
function readingFor(date,id){return (state.readings[date]||{})[id]}
function canEdit(r){return !!r&&Date.now()<r.createdAt+4*60*60*1000}
function remaining(r){if(!r)return '';let ms=Math.max(0,r.createdAt+4*60*60*1000-Date.now());return `${Math.floor(ms/3600000)}h ${Math.floor(ms%3600000/60000)}m left to edit`}
function slotCard(s,date){const r=readingFor(date,s.id);let edit=r&&canEdit(r);return `<div class="slot"><div class="slot-icon">${s.icon}</div><div class="slot-copy"><b>${s.name}</b><span>${r?(edit?remaining(r):'Editing window closed'):'Not recorded yet'}</span></div>${r?`<div style="text-align:right"><div class="value">${r.value}<span class="unit"> mg/dL</span></div><span class="status">Recorded</span>${edit?`<div><button class="text-btn" data-edit="${s.id}" data-date="${date}">Edit</button></div>`:''}</div>`:`${isToday(date)?`<button class="secondary" data-add="${s.id}" data-date="${date}">+ Add</button>`:`<span class="status missed">Missed</span>`}`}</div>`}
function chartSvg(){const values=[112,125,119,138,131,146,128,142,134,150,141,147];const points=values.map((v,i)=>`${35+i*48},${180-(v-80)*1.4}`).join(' ');let circles=values.map((v,i)=>`<circle cx="${35+i*48}" cy="${180-(v-80)*1.4}" r="3.4" fill="#178b83" stroke="#fff" stroke-width="2"/>`).join('');let grid=[90,110,130,150,170].map(v=>`<line x1="25" x2="565" y1="${180-(v-80)*1.4}" y2="${180-(v-80)*1.4}" stroke="#edf0f3" stroke-dasharray="3 4"/><text x="0" y="${184-(v-80)*1.4}" fill="#9aa3ad" font-size="9">${v}</text>`).join('');return `<svg viewBox="0 0 580 220" role="img" aria-label="Illustrative glucose trend chart">${grid}<polyline points="${points}" fill="none" stroke="#178b83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${circles}${[1,4,7,10].map((n,i)=>`<text x="${35+n*48}" y="210" text-anchor="middle" fill="#9aa3ad" font-size="10">${['Oct 28','Nov 1','Nov 4','Nov 7'][i]}</text>`).join('')}</svg>`}
function dashboard(){const date=todayISO(),n=countFor(date),vals=Object.values(state.readings[date]||{}).map(x=>x.value),avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;return `<div class="welcome"><div><h2>Good evening, Chaitanya <span>✦</span></h2><p>Small steps every day make a healthier you. Here's your tracking summary.</p></div><div class="date-pill">▦ &nbsp; ${fmtDate(date)}</div></div><div class="grid stats"><div class="card"><div class="stat-top">Today's progress <span class="stat-icon">✓</span></div><div class="stat-number">${n}<span style="font-size:15px;color:#9aa3ad"> / 4</span></div><div class="stat-note green">${n===4?'All readings complete':`${4-n} readings remaining`}</div></div><div class="card"><div class="stat-top">Today's average <span class="stat-icon purple">⌁</span></div><div class="stat-number">${avg??'—'}<span style="font-size:12px;color:#9aa3ad"> mg/dL</span></div><div class="stat-note">Based on ${vals.length} recorded readings</div></div><div class="card"><div class="stat-top">Current subscription <span class="stat-icon coral">◇</span></div><div class="stat-number" style="font-size:23px">${state.subscription}</div><div class="stat-note">Dr. Ananya Rao · Demo plan</div></div><div class="card"><div class="stat-top">Next consultation <span class="stat-icon gold">◷</span></div><div class="stat-number" style="font-size:22px">Nov 12</div><div class="stat-note">10:30 AM · Sample appointment</div></div></div><div class="grid layout-two"><section class="card"><div class="card-head"><div><h3>Glucose trends</h3><p>Your recent readings at a glance</p></div><select class="select" id="dashRange"><option>Last 14 days</option><option>This month</option><option>Full history</option></select></div><div class="chart-wrap">${chartSvg()}</div><div class="legend"><span><i></i> Glucose readings</span><span><i></i> Trend comparison</span><span><i></i> Sample data</span></div></section><section class="card"><div class="card-head"><div><h3>Today's readings</h3><p>Four slots, one simple routine</p></div><button class="text-btn" data-page="tracking">View all →</button></div><div class="progress-row"><span>Daily completion</span><b>${n}/4</b></div><div class="progress"><span style="width:${n*25}%"></span></div><div class="slots" style="margin-top:15px">${slots.map(s=>slotCard(s,date)).join('')}</div></section></div><div class="grid layout-two"><section class="card"><div class="card-head"><div><h3>Tracking calendar</h3><p>Stay consistent with your daily routine</p></div><button class="text-btn" data-page="calendar">Open calendar →</button></div>${calendarMarkup(new Date().getFullYear(),new Date().getMonth(),false)}</section><section class="card"><div class="card-head"><div><h3>Upcoming consultation</h3><p>Your care, connected</p></div><span class="status">Active</span></div><div style="display:flex;gap:13px;align-items:center"><div class="avatar coral" style="width:55px;height:55px;font-size:21px">AR</div><div><b style="font-size:13px">Dr. Ananya Rao</b><div class="small" style="margin:4px 0">Endocrinologist · Verified demo</div><span class="small">Nov 12, 2026 · 10:30 AM</span></div></div><div class="notice info">Your consultation access is active in this prototype. Sample data is for demonstration only.</div><button class="primary" data-page="chat">Open consultation chat</button></section></div>`}
function calendarMarkup(year,month,full=true){const first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;let cells='';['M','T','W','T','F','S','S'].forEach(x=>cells+=`<div class="dayname">${x}</div>`);for(let i=0;i<offset;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n=countFor(iso),cls=[isToday(iso)?'today':'',n===4?'complete':n>0?'partial':''].join(' '),future=iso>todayISO();cells+=`<button class="calday ${cls}" data-caldate="${iso}" ${future?'disabled':''} title="${n}/4 readings">${d}</button>`}return `<div class="card-head" style="margin-bottom:10px"><button class="secondary" data-calprev="1">‹</button><b style="font-size:13px">${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button class="secondary" data-calnext="1">›</button></div><div class="calendar-grid">${cells}</div>${full?`<div class="legend"><span><i style="background:var(--teal)"></i> Today</span><span><i style="background:#21a18e"></i> Complete</span><span><i style="background:#dca94a"></i> Partial</span></div><div class="divider"></div><div class="progress-row"><b>Selected date</b><span id="selectedCalDate">${fmtDate(state.selectedDate)}</span></div><div class="slots">${slots.map(s=>slotCard(s,state.selectedDate)).join('')}</div>`:''}`}
function tracking(){let date=state.selectedDate;return `<div class="welcome"><div><h2>Daily glucose log</h2><p>Record today's readings in the appropriate slot. Past dates are view-only.</p></div><div class="date-pill">Today · ${fmtDate(todayISO())}</div></div><div class="grid layout-two"><section class="card"><div class="card-head"><div><h3>Reading slots</h3><p>${fmtDate(date)} · ${countFor(date)}/4 recorded</p></div><span class="status ${isToday(date)?'':'locked'}">${isToday(date)?'Current date':'Read only'}</span></div><div class="slots">${slots.map(s=>slotCard(s,date)).join('')}</div><div class="notice info">New entries are allowed only for today's date. Each saved reading can be edited for four hours from its original creation time; editing does not extend that window.</div></section><section class="card"><div class="card-head"><div><h3>How it works</h3><p>Keep your tracking consistent</p></div><span class="stat-icon">♡</span></div><div class="slots"><div class="slot"><div class="slot-icon">①</div><div class="slot-copy"><b>Choose a slot</b><span>Morning fasting, after breakfast, lunch or dinner</span></div></div><div class="slot"><div class="slot-icon">②</div><div class="slot-copy"><b>Enter a valid value</b><span>Whole number from 40 to 600 mg/dL</span></div></div><div class="slot"><div class="slot-icon">③</div><div class="slot-copy"><b>Save and review</b><span>One reading per slot, maximum four per day</span></div></div></div><div class="notice">This prototype's sample readings are illustrative only and should not be used for medical decisions.</div></section></div>`}

tion required</h3><p>Pending work</p></div><span class="status pending">8 items</span></div><div class="slots"><div class="slot"><div class="slot-icon">₹</div><div class="slot-copy"><b>Payment verification</b><span>3 submissions awaiting review</span></div><button class="text-btn" data-page="doctorRequests">Review</button></div><div class="slot"><div class="slot-icon">◷</div><div class="slot-copy"><b>Consultation requests</b><span>5 requests awaiting a response</span></div><button class="text-btn" data-page="doctorRequests">Open</button></div><div class="slot"><div class="slot-icon">▤</div><div class="slot-copy"><b>Patient messages</b><span>2 unread conversations</span></div><button class="text-btn" data-page="doctorChat">Reply</button></div></div></section></div>`}

function doctorRequests(){return `<div class="welcome"><div><h2>Requests & payment verification</h2><p>Review consultation requests and payment evidence before activating subscriptions.</p></div></div><section class="card"><div class="tabs"><button class="active" data-doctortab="pending">Pending payments (3)</button><button data-doctortab="requests">Consultation requests (5)</button><button data-doctortab="history">Reviewed</button></div><div id="requestTable"></div></section><div class="notice info">Payment proof is not conclusive by itself. Verify the transaction before activation and record reviewer, decision, timestamp, and rejection reason.</div>`}
function renderRequests(){const tab=state.doctorTab;let rows=tab==='pending'?[['Meera Patel','₹250 · Every 30 days','TXN-58XQ21','Today, 9:10 AM'],['Rahul Kumar','₹400 · Every 15 days','TXN-19PA62','Today, 8:45 AM'],['Anita Sharma','₹600 · Every 7 days','TXN-73LM44','Yesterday, 6:30 PM']]:tab==='requests'?[['Kiran Reddy','New consultation','—','Today, 8:35 AM'],['Priya Nair','New consultation','—','Today, 8:10 AM']]:[['Sanjay Rao','₹250 · Approved','TXN-08QQ13','Yesterday, 4:30 PM']];$('#requestTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>Plan / request</th><th>Reference ID</th><th>Submitted</th><th>Action</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${tab==='history'?'<span class="status">Reviewed</span>':`<button class="secondary" data-review="${i}">${tab==='pending'?'Review proof':'Review request'}</button>`}</td></tr>`).join('')}</tbody></table></div>`}
function doctorChat(){return `<div class="welcome"><div><h2>Patient messages</h2><p>Communicate with patients who have valid consultation authorization.</p></div></div>${chatPage()}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){navRender();$('#pageTitle').textContent=titles[state.page]||'Dashboard';$('#crumbPage').textContent=titles[state.page]||'Dashboard';$('#miniName').textContent=state.role==='patient'?'Chaitanya S.':'Dr. Ananya Rao';$('#miniRole').textContent=state.role==='patient'?'Patient account':'Doctor account';$('#miniAvatar').textContent=state.role==='patient'?'CS':'AR';$('#topAvatar').textContent=state.role==='patient'?'CS':'AR';$$('[data-role]').forEach(b=>b.classList.toggle('selected',b.dataset.role===state.role));const pages={dashboard,tracking,calendar:calendarPage,analytics,reports,doctors,subscriptions,chat:chatPage,notifications,profile,doctorDashboard,patients,doctorRequests,doctorChat};$('#content').innerHTML=(pages[state.page]||dashboard)();bindPage();}
function bindPage(){ $$('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));$$('[data-role]').forEach(b=>b.addEventListener('click',()=>setRole(b.dataset.role)));$$('[data-add]').forEach(b=>b.addEventListener('click',()=>openReading(b.dataset.date,b.dataset.add)));$$('[data-edit]').forEach(b=>b.addEventListener('click',()=>openReading(b.dataset.date,b.dataset.edit)));$$('[data-caldate]').forEach(b=>b.addEventListener('click',()=>{state.selectedDate=b.dataset.caldate;render()}));$$('[data-calprev]').forEach(b=>b.addEventListener('click',()=>{state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()-1,1);render()}));$$('[data-calnext]').forEach(b=>b.addEventListener('click',()=>{state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+1,1);if(state.calMonth>new Date(new Date().getFullYear(),new Date().getMonth(),1))state.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()}));$$('[data-today]').forEach(b=>b.addEventListener('click',()=>{state.calMonth=new Date();state.selectedDate=todayISO();render()}));$$('[data-plan]').forEach(b=>b.addEventListener('click',()=>{state.plan=Number(b.dataset.plan);render()}));$$('[data-book]').forEach(b=>b.addEventListener('click',()=>{state.plan=Number(b.dataset.book);go('subscriptions')}));$$('[data-doctortab]').forEach(b=>b.addEventListener('click',()=>{state.doctorTab=b.dataset.doctortab;$$('[data-doctortab]').forEach(x=>x.classList.toggle('active',x===b));renderRequests()}));$$('[data-review]').forEach(b=>b.addEventListener('click',()=>reviewItem(b.dataset.review)));$$('[data-viewpatient]').forEach(b=>b.addEventListener('click',()=>{toast('Opening authorized demo record for '+b.dataset.viewpatient);go('analytics')}));$$('[data-notifread]').forEach(b=>b.addEventListener('click',()=>{state.notificationsRead=true;render();toast('Notification marked as read')}));const search=$('#doctorSearch');if(search)search.addEventListener('input',()=>$$('.doctor-card').forEach(c=>c.classList.toggle('hidden',!c.dataset.specialty.includes(search.value.toLowerCase()))));const sort=$('#doctorSort');if(sort)sort.addEventListener('change',()=>{const list=$('#doctorList');[...list.children].sort((a,b)=>sort.value==='Lowest price'?parseInt(a.querySelector('.doctor-price b').textContent.replace(/\D/g,''))-parseInt(b.querySelector('.doctor-price b').textContent.replace(/\D/g,'')):0).forEach(c=>list.appendChild(c))});const type=$('#reportType');if(type)type.addEventListener('change',()=>$$('.customfield').forEach(f=>f.classList.toggle('hidden',type.value!=='Custom date range')));if($('#previewReport'))$('#previewReport').addEventListener('click',()=>makeReport(false));if($('#exportCsv'))$('#exportCsv').addEventListener('click',()=>makeReport(true));if($('#submitPayment'))$('#submitPayment').addEventListener('click',submitPayment);if($('#sendMessage'))$('#sendMessage').addEventListener('click',sendMessage);if($('#chatInput'))$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});if($('#followupBtn'))$('#followupBtn').addEventListener('click',submitFollowup);if($('#markAll'))$('#markAll').addEventListener('click',()=>{state.notificationsRead=true;render();toast('All notifications marked as read')});if($('#saveProfile'))$('#saveProfile').addEventListener('click',()=>toast('Profile changes saved in prototype'));if($('#patientSearch'))$('#patientSearch').addEventListener('input',()=>$$('[data-patient]').forEach(r=>r.classList.toggle('hidden',!r.dataset.patient.includes($('#patientSearch').value.toLowerCase()))));if($('#dashRange'))$('#dashRange').addEventListener('change',()=>toast('Chart filter updated: '+$('#dashRange').value));if($('#analyticsRange'))$('#analyticsRange').addEventListener('change',()=>toast('Date filter selected: '+$('#analyticsRange').value));}
function openReading(date,slotId){if(date!==todayISO()){toast('Date cannot be in the past or future. Past dates are view-only.');return}const slot=slots.find(s=>s.id===slotId),r=readingFor(date,slotId);if(r&&!canEdit(r)){toast('Editing is available only within 4 hours of recording.');return}const modal=document.createElement('div');modal.style='position:fixed;inset:0;background:#17202d66;display:grid;place-items:center;padding:18px;z-index:20';modal.innerHTML=`<section class="card" style="width:min(460px,100%);box-shadow:0 25px 80px #0003"><div class="card-head"><div><h3>${r?'Edit':'Add'} ${slot.name} reading</h3><p>${fmtDate(date)} · Current date only</p></div><button class="iconbtn" id="closeModal">×</button></div><form id="readingForm"><div class="field"><label>Glucose value (mg/dL)</label><input id="glucoseValue" type="number" step="1" min="40" max="600" required placeholder="Enter a whole number" value="${r?r.value:''}"><small>Allowed range: 40–600 mg/dL, whole numbers only.</small></div><div id="readErr" class="notice error hidden"></div><div class="form-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button type="submit" class="primary">Save reading</button></div></form></section>`;document.body.appendChild(modal);const close=()=>modal.remove();$('#closeModal').onclick=close;$('#cancelModal').onclick=close;$('#readingForm').onsubmit=e=>{e.preventDefault();const raw=$('#glucoseValue').value.trim(),v=Number(raw),err=$('#readErr');let msg='';if(!raw)msg='Please enter a glucose value.';else if(!Number.isInteger(v)||v<40||v>600)msg='Value must be between 40 and 600 mg/dl.';else if(!r&&readingFor(date,slotId))msg=`You already have an ${slot.name} reading for this date.`;else if(countFor(date)>=4&&!r)msg='You can add only 4 readings per day.';if(msg){err.textContent=msg;err.classList.remove('hidden');return}state.readings[date]=state.readings[date]||{};if(r){r.value=v;r.updatedAt=Date.now()}else state.readings[date][slotId]={value:v,createdAt:Date.now(),updatedAt:Date.now()};close();render();toast(r?'Reading updated successfully':'Glucose reading saved')};}
function reportRecords(){let all=[];Object.keys(state.readings).forEach(date=>Object.entries(state.readings[date]).forEach(([id,r])=>all.push({date,slot:slots.find(s=>s.id===id).name,value:r.value,created:new Date(r.createdAt).toLocaleString('en-IN'),updated:new Date(r.updatedAt).toLocaleString('en-IN')})));const type=$('#reportType').value,selected=$('#reportDate').value||todayISO();let start='',end=selected;if(type==='Daily report')start=end=selected;else if(type==='Month-to-date'){start=selected.slice(0,7)+'-01'}else if(type==='Previous full month'){const d=new Date(selected+'T12:00:00');const p=new Date(d.getFullYear(),d.getMonth()-1,1);start=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-01`;end=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-${String(new Date(p.getFullYear(),p.getMonth()+1,0).getDate()).padStart(2,'0')}`}else if(type==='Custom date range'){start=$('#reportStart').value||selected;end=$('#reportEnd').value||selected}else{start='0000-01-01';end='9999-12-31'}return all.filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>a.date.localeCompare(b.date))}
function makeReport(download){const rows=reportRecords();if(download){const header=['Date','Time Slot','Glucose Value (mg/dL)','Created At','Updated At'];const csv=[header,...rows.map(r=>[r.date,r.slot,r.value,r.created,r.updated])].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sweety-glucose-report.csv';a.click();URL.revokeObjectURL(url);toast('CSV exported (prototype records only)')}else{$('#reportSummary').textContent=`${rows.length} reading(s) found · Prototype dataset`;$('#reportRows').innerHTML=rows.length?rows.map(r=>`<tr><td>${r.date}</td><td>${r.slot}</td><td><b>${r.value} mg/dL</b></td><td>${r.created}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No readings found for this date range.</td></tr>';}}
function submitPayment(){const txn=$('#txnId').value.trim();if(state.plan===null){toast('Please choose a consultation plan first');return}if(!txn){toast('Please enter a payment reference ID');return}if(txn.length<5){toast('Please enter a valid reference ID');return}state.subscription='Pending';$('#subStatus').textContent='Pending verification';$('#subStatus').className='status pending';toast('Payment proof submitted. Subscription remains pending verification.');}
function sendMessage(){const input=$('#chatInput');if(!input||!input.value.trim())return;state.chat.push({who:'mine',text:input.value.trim(),time:timeNow()});render();const el=$('#messages');if(el)el.scrollTop=el.scrollHeight;toast('Demo message sent')}
function submitFollowup(){const text=$('#followupText').value.trim();if(!text){toast('Please enter your follow-up question');return}toast('Follow-up request submitted for doctor review');$('#followupText').value=''}
function reviewItem(i){if(state.doctorTab==='pending'){const action=prompt('Type APPROVE to confirm payment or REJECT to reject it:','APPROVE');if(!action)return;if(action.toUpperCase()==='APPROVE'){toast('Payment marked verified in prototype. Production must verify transaction first.')}else if(action.toUpperCase()==='REJECT'){const reason=prompt('Enter rejection reason:');if(reason&&reason.trim())toast('Payment rejected with reason recorded in prototype');else toast('Rejection requires a reason')}else toast('No change made')}else{const action=prompt('Type ACCEPT or REJECT for this request:','ACCEPT');if(action)toast('Request decision recorded in prototype: '+action.toUpperCase())}}
render();
