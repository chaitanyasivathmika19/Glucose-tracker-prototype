/* SWEETY SIGNATURE UI — editorial healthcare / premium motion system */
:root{
 --ink:#172536;--muted:#718096;--line:#e4eaf1;--bg:#f4f7fb;--white:#fff;
 --teal:#087f8c;--teal2:#e4f6f5;--purple:#7164e8;--purple2:#efedff;
 --coral:#f08b78;--gold:#d9a441;--shadow:0 14px 42px rgba(25,44,70,.07);--radius:20px;
 --navy:#101c31;--navy2:#172843;--mint:#65e0c0;
}
body{background:radial-gradient(ellipse at 85% 0%,rgba(113,100,232,.07),transparent 30%),radial-gradient(ellipse at 5% 70%,rgba(8,127,140,.06),transparent 28%),#f5f8fc;color:var(--ink);letter-spacing:-.01em}
button,input,select,textarea{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease,background .2s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(8,127,140,.24);outline-offset:2px}
.sidebar{background:linear-gradient(180deg,#101c31 0%,#14233c 100%);border-right:1px solid rgba(255,255,255,.08);color:#e9f0fb;box-shadow:10px 0 35px rgba(14,28,49,.07)}
.brand{color:#fff;padding-bottom:34px}
.logo{background:linear-gradient(135deg,#60e3c4,#6d76f5);box-shadow:0 8px 24px rgba(91,218,199,.25);border:1px solid rgba(255,255,255,.3);position:relative;overflow:hidden}
.logo:after{content:"";position:absolute;inset:-80% auto -80% -45%;width:35%;transform:rotate(25deg);background:rgba(255,255,255,.45);animation:logoShimmer 5.5s ease-in-out infinite}
.nav-label{color:#8294b0;letter-spacing:2px}
.nav button{color:#aebbd0;border:1px solid transparent;position:relative;overflow:hidden}
.nav button .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.055);color:#b7c8e2;font-size:15px;flex-shrink:0;transition:all .25s ease}
.nav button.active,.nav button:hover{background:linear-gradient(105deg,rgba(80,220,193,.17),rgba(112,101,232,.16));color:#fff;border-color:rgba(122,226,212,.16)}
.nav button.active:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0;background:linear-gradient(#65e0c0,#8b83ff)}
.nav button.active .ico,.nav button:hover .ico{background:linear-gradient(135deg,#1caaa0,#7771ee);color:white;box-shadow:0 5px 15px rgba(57,181,177,.22);transform:translateY(-1px)}
.side-bottom .nav button:hover{background:rgba(255,255,255,.06)}
.profile-mini{border-top-color:rgba(255,255,255,.12)}
.profile-mini .profile-text b{color:#f7f9fd}
.profile-mini .small{color:#91a3bd}
.main{animation:workspaceIn .65s cubic-bezier(.2,.75,.2,1) both}
.topbar{margin-bottom:30px}
.crumb{color:#8a97aa;letter-spacing:.035em}
.page-title{font-size:clamp(26px,2.3vw,34px);letter-spacing:-1.15px;line-height:1.15}
.top-actions .iconbtn{border-radius:14px}
.avatar{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.welcome h2{font-size:clamp(21px,1.8vw,27px);letter-spacing:-.8px}
.welcome p{max-width:650px}
.date-pill{box-shadow:0 4px 14px rgba(25,44,70,.035);border-radius:14px}
.card,.doctor-card,.plan{border-color:rgba(219,228,238,.9);box-shadow:0 10px 32px rgba(25,44,70,.045);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover,.doctor-card:hover,.plan:hover{box-shadow:0 18px 46px rgba(25,44,70,.09);border-color:#d2e5e8}
.card{border-radius:22px}
.stat-icon{border-radius:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.stat-number{letter-spacing:-1.3px}
.primary{background:linear-gradient(115deg,#078b8c,#466bdc);box-shadow:0 7px 18px rgba(8,127,140,.19);border-radius:12px;position:relative;overflow:hidden}
.primary:before{content:"";position:absolute;inset:0;transform:translateX(-120%);background:linear-gradient(100deg,transparent,rgba(255,255,255,.24),transparent);transition:transform .65s ease}
.primary:hover{background:linear-gradient(115deg,#06777e,#5d5fe0);transform:translateY(-2px);box-shadow:0 11px 24px rgba(8,127,140,.25)}
.primary:hover:before{transform:translateX(120%)}
.secondary{border-radius:12px}
.secondary:hover{border-color:#9bcfce;background:#f4fbfa;transform:translateY(-1px)}
.text-btn{border-radius:8px}
.text-btn:hover{background:rgba(8,127,140,.07)}
.slot{border-radius:16px;transition:transform .2s ease,border-color .2s ease,background .2s ease}
.slot:hover{transform:translateY(-2px);border-color:#c8e4e4;background:linear-gradient(100deg,#fff,#fbfefe)}
.slot-icon{border-radius:13px;color:#3d6e8b}
.progress span{background:linear-gradient(90deg,#4ad3b5,#7770ef);box-shadow:0 0 14px rgba(91,191,207,.25);transition:width .45s ease}
.status{letter-spacing:.01em}
.field input,.field select,.field textarea{border-radius:12px}
.table tbody tr{transition:background .18s ease}
.table tbody tr:hover{background:#f7fafc}
.doctor-photo{box-shadow:inset 0 0 0 1px rgba(8,127,140,.08)}
.toast{border:1px solid rgba(255,255,255,.12);background:linear-gradient(120deg,#14243b,#243e5b);box-shadow:0 18px 45px rgba(11,28,49,.25)}
.footer-note{letter-spacing:.14em;font-size:9px}
@keyframes workspaceIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes logoShimmer{0%,70%,100%{left:-45%}35%{left:125%}}
@keyframes floatSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

 html{scroll-behavior:auto}
 *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

<header class="topbar"><div><div class="crumb">Workspace / <span id="crumbPage">Overview</span></div><h1 class="page-title" id="pageTitle">Patient dashboard</h1></div><div class="top-actions"><button class="iconbtn" data-page="notifications" title="Notifications">♧<span class="dot"></span></button><div class="avatar" id="topAvatar">CS</div><button class="signout-btn" id="signOut">Sign out</button></div></header>

</main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={role:'patient',currentUser:null,authMode:'signin',authRole:'patient',page:'dashboard',selectedDate:todayISO(),readings:{},editingId:null,plan:null,notificationsRead:false,chatUnlocked:true,subscription:'Active',patientChat:[{who:'them',text:'Hi Chaitanya! I reviewed your latest readings. How have you been feeling this week?',time:'10:32 AM'},{who:'mine',text:'Hello doctor, I have been tracking my readings every day.',time:'10:35 AM'},{who:'them',text:'Great. Keep recording consistently and we can discuss the trend at your consultation.',time:'10:36 AM'}],doctorChats:{'Meera Patel':[{who:'them',text:'Good morning, doctor. I recorded my reading after breakfast.',time:'9:20 AM'},{who:'mine',text:'Thank you for recording it. Please continue tracking consistently.',time:'9:24 AM'}]},selectedPatient:'Meera Patel',doctorTab:'pending',calMonth:new Date(),doctorQr:localStorage.getItem('sweetyDoctorQr')||''};
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(iso){if(!iso)return '';return new Date(iso+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function isToday(iso){return iso===todayISO()}function timeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
const slots=[{id:'morning',name:'Morning (fasting)',icon:'☀',time:'Before breakfast'},{id:'breakfast',name:'After breakfast',icon:'☕',time:'After your morning meal'},{id:'lunch',name:'After lunch',icon:'🍽',time:'After your afternoon meal'},{id:'dinner',name:'After dinner',icon:'🌙',time:'After your evening meal'}];
// Demonstration records are clearly marked as sample data. Current date is populated for prototype interactions.
state.readings[todayISO()]={morning:{value:108,createdAt:Date.now()-60*60*1000,updatedAt:Date.now()-60*60*1000},breakfast:{value:142,createdAt:Date.now()-2*60*60*1000,updatedAt:Date.now()-2*60*60*1000}};
const patientNav=[['dashboard','▦','Overview'],['tracking','＋','Glucose tracking'],['calendar','▦','Calendar'],['analytics','⌁','Charts & statistics'],['reports','▤','Reports & exports'],['doctors','✚','Find a doctor'],['subscriptions','◇','My consultation'],['chat','▤','Messages'],['notifications','♧','Notifications']];
const doctorNav=[['doctorDashboard','▦','Overview'],['patients','♙','My patients'],['doctorRequests','◷','Requests & payments'],['doctorChat','▤','Messages'],['notifications','♧','Notifications']];
const titles={dashboard:'Patient dashboard',tracking:'Glucose tracking',calendar:'Tracking calendar',analytics:'Charts & statistics',reports:'Reports & exports',doctors:'Find a doctor',subscriptions:'My consultation',chat:'Messages',notifications:'Notifications',profile:'Profile settings',doctorDashboard:'Doctor dashboard',patients:'Authorized patients',doctorRequests:'Requests & payments',doctorChat:'Patient messages'};
function navRender() {
 const arr=state.role==='patient'?patientNav:doctorNav;
 const iconPaths={
  'Overview':'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/>',
  'Glucose tracking':'<path d="M12 3v18"/><path d="M5 12h14"/><circle cx="12" cy="12" r="8"/>',
  'Calendar':'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m8 15 2 2 5-5"/>',
  'Charts & statistics':'<path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 6-7"/><circle cx="7" cy="14" r="1"/><circle cx="11" cy="10" r="1"/><circle cx="14" cy="13" r="1"/>',
  'Reports & exports':'<path d="M7 3h8l4 4v14H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/><path d="M15 3v5h5M8 12h7M8 16h7"/>',
  'Find a doctor':'<path d="M8 3v4M6 5h4"/><path d="M12 13a4 4 0 1 0-4-4"/><path d="M4 21v-2a6 6 0 0 1 12 0v2"/><path d="M17 11h4M19 9v4"/>',
  'My consultation':'<path d="M12 3 21 12 12 21 3 12Z"/><path d="M9 12h6M12 9v6"/>',
  'Messages':'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.7 8.7 0 0 1-3.5-.7L4 20l1.2-3.6A7 7 0 0 1 4 12c0-4.1 3.6-7.5 8-7.5s8 3.1 8 7Z"/><path d="M8 11h8M8 14h5"/>',
  'Notifications':'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
  'My patients':'<circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8M18 14a6 6 0 0 1 4 6"/>',
  'Requests & payments':'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',

 };
 const icon=(label,fallback)=>`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${iconPaths[label]||iconPaths['Overview']}</svg>`;
 $('#nav').innerHTML=arr.map(([id,ico,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}"><span class="ico">${icon(label,ico)}</span><span class="navtext">${label}</span></button>`).join('');
 $$('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
}
function go(page){state.page=page;render()}
function setRole(role){state.role=role;state.page=role==='patient'?'dashboard':'doctorDashboard';render();toast(role==='patient'?'Patient view selected':'Doctor view selected')}

function dashboard(){const date=todayISO(),n=countFor(date),vals=Object.values(state.readings[date]||{}).map(x=>x.value),avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;return `<div class="welcome"><div><h2>Good evening, Chaitanya <span>✦</span></h2><p>Small steps every day make a healthier you. Here's your tracking summary.</p></div><div class="date-pill">▦ &nbsp; ${fmtDate(date)}</div></div><div class="grid stats"><div class="card"><div class="stat-top">Today's progress <span class="stat-icon">✓</span></div><div class="stat-number">${n}<span style="font-size:15px;color:#9aa3ad"> / 4</span></div><div class="stat-note green">${n===4?'All readings complete':`${4-n} readings remaining`}</div></div><div class="card"><div class="stat-top">Today's average <span class="stat-icon purple">⌁</span></div><div class="stat-number">${avg??'—'}<span style="font-size:12px;color:#9aa3ad"> mg/dL</span></div><div class="stat-note">Based on ${vals.length} recorded readings</div></div><div class="card"><div class="stat-top">Current subscription <span class="stat-icon coral">◇</span></div><div class="stat-number" style="font-size:23px">${state.subscription}</div><div class="stat-note">Dr. Ananya Rao · Demo plan</div></div><div class="card"><div class="stat-top">Next consultation <span class="stat-icon gold">◷</span></div><div class="stat-number" style="font-size:22px">Nov 12</div><div class="stat-note">10:30 AM · Sample appointment</div></div></div><div class="grid layout-two"><section class="card"><div class="card-head"><div><h3>Glucose trends</h3><p>Your recent readings at a glance</p></div><select class="select" id="dashRange"><option>Last 14 days</option><option>This month</option><option>Full history</option></select></div><div class="chart-wrap">${chartSvg()}</div><div class="legend"><span><i></i> Glucose readings</span><span><i></i> Trend comparison</span><span><i></i> Sample data</span></div></section><section class="card"><div class="card-head"><div><h3>Today's readings</h3><p>Four slots, one simple routine</p></div><button class="text-btn" data-page="tracking">View all →</button></div><div class="progress-row"><span>Daily completion</span><b>${n}/4</b></div><div class="progress"><span style="width:${n*25}%"></span></div><div class="slots" style="margin-top:15px">${slots.map(s=>slotCard(s,date)).join('')}</div></section></div><div class="grid layout-two"><section class="card"><div class="card-head"><div><h3>Tracking calendar</h3><p>Stay consistent with your daily routine</p></div><button class="text-btn" data-page="calendar">Open calendar →</button></div>${calendarMarkup(new Date().getFullYear(),new Date().getMonth(),false)}</section><section class="card"><div class="card-head"><div><h3>Upcoming consultation</h3><p>Your care, connected</p></div><span class="status">Active</span></div><div style="display:flex;gap:13px;align-items:center"><div class="avatar coral" style="width:55px;height:55px;font-size:21px">AR</div><div><b style="font-size:13px">Dr. Ananya Rao</b><div class="small" style="margin:4px 0">Endocrinologist · Verified demo</div><span class="small">Nov 12, 2026 · 10:30 AM</span></div></div><div class="notice info">Your consultation access is active in this prototype. Sample data is for demonstration only.</div><button class="primary" data-page="chat">Open consultation chat</button></section></div>`}
function calendarMarkup(year,month,full=true){const first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;let cells='';['M','T','W','T','F','S','S'].forEach(x=>cells+=`<div class="dayname">${x}</div>`);for(let i=0;i<offset;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n=countFor(iso),cls=[isToday(iso)?'today':'',n===4?'complete':n>0?'partial':''].join(' '),future=iso>todayISO();cells+=`<button class="calday ${cls}" data-caldate="${iso}" ${future?'disabled':''} title="${n}/4 readings">${d}</button>`}return `<div class="card-head" style="margin-bottom:10px"><button class="secondary" data-calprev="1">‹</button><b style="font-size:13px">${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button class="secondary" data-calnext="1">›</button></div><div class="calendar-grid">${cells}</div>${full?`<div class="legend"><span><i style="background:var(--teal)"></i> Today</span><span><i style="background:#21a18e"></i> Complete</span><span><i style="background:#dca94a"></i> Partial</span></div><div class="divider"></div><div class="progress-row"><b>Selected date</b><span id="selectedCalDate">${fmtDate(state.selectedDate)}</span></div><div class="slots">${slots.map(s=>slotCard(s,state.selectedDate)).join('')}</div>`:''}`}
function tracking(){let date=state.selectedDate;return `<div class="welcome"><div><h2>Daily glucose log</h2><p>Record today's readings in the appropriate slot. Past dates are view-only.</p></div><div class="date-pill">Today · ${fmtDate(todayISO())}</div></div><div class="grid layout-two"><section class="card"><div class="card-head"><div><h3>Reading slots</h3><p>${fmtDate(date)} · ${countFor(date)}/4 recorded</p></div><span class="status ${isToday(date)?'':'locked'}">${isToday(date)?'Current date':'Read only'}</span></div><div class="slots">${slots.map(s=>slotCard(s,date)).join('')}</div><div class="notice info">New entries are allowed only for today's date. Each saved reading can be edited for four hours from its original creation time; editing does not extend that window.</div></section><section class="card"><div class="card-head"><div><h3>How it works</h3><p>Keep your tracking consistent</p></div><span class="stat-icon">♡</span></div><div class="slots"><div class="slot"><div class="slot-icon">①</div><div class="slot-copy"><b>Choose a slot</b><span>Morning fasting, after breakfast, lunch or dinner</span></div></div><div class="slot"><div class="slot-icon">②</div><div class="slot-copy"><b>Enter a valid value</b><span>Whole number from 40 to 600 mg/dL</span></div></div><div class="slot"><div class="slot-icon">③</div><div class="slot-copy"><b>Save and review</b><span>One reading per slot, maximum four per day</span></div></div></div><div class="notice">This prototype's sample readings are illustrative only and should not be used for medical decisions.</div></section></div>`}
function calendarPage(){const d=state.calMonth;return `<div class="welcome"><div><h2>Your tracking calendar</h2><p>Choose a date to review recorded readings. Past dates cannot be edited or filled in.</p></div><button class="secondary" data-today="1">Go to today</button></div><div class="grid layout-two"><section class="card">${calendarMarkup(d.getFullYear(),d.getMonth(),true)}</section><section class="card"><div class="card-head"><div><h3>Completion guide</h3><p>Understand your tracking consistency</p></div></div><div class="slots"><div class="slot"><span class="status">4/4 Complete</span><div class="slot-copy"><b>All slots recorded</b><span>Every daily reading has been saved.</span></div></div><div class="slot"><span class="status pending">1–3/4 Partial</span><div class="slot-copy"><b>Partially recorded</b><span>One or more slots are missing.</span></div></div><div class="slot"><span class="status missed">0/4 Empty</span><div class="slot-copy"><b>No readings recorded</b><span>Past empty dates remain view-only.</span></div></div></div><div class="notice info">Completion indicators are based only on actual saved readings; no missing values are fabricated.</div></section></div>`}
function analytics(){return `<div class="welcome"><div><h2>Understand your trends</h2><p>Explore actual readings over time. Summary values update from the demonstration dataset.</p></div><select class="select" id="analyticsRange"><option>Daily</option><option selected>Month-to-date</option><option>Previous month</option><option>Custom range</option><option>Full history</option></select></div><div class="grid stats"><div class="card"><div class="stat-top">Highest reading <span class="stat-icon coral">↑</span></div><div class="stat-number">150 <span class="unit">mg/dL</span></div><div class="stat-note">Illustrative sample data</div></div><div class="card"><div class="stat-top">Lowest reading <span class="stat-icon">↓</span></div><div class="stat-number">108 <span class="unit">mg/dL</span></div><div class="stat-note">Illustrative sample data</div></div><div class="card"><div class="stat-top">Average reading <span class="stat-icon purple">⌁</span></div><div class="stat-number">132.8 <span class="unit">mg/dL</span></div><div class="stat-note">Rounded to one decimal place</div></div><div class="card"><div class="stat-top">Total readings <span class="stat-icon gold">▤</span></div><div class="stat-number">28</div><div class="stat-note">Demo dataset</div></div></div><section class="card"><div class="card-head"><div><h3>Glucose trend</h3><p>Daily values · mg/dL</p></div><div class="legend"><span><i></i> Recorded values</span><span><i style="background:#9aa3ad"></i> Sample reference</span></div></div><div class="chart-wrap" style="height:280px">${chartSvg()}</div><div class="notice">Charts are for tracking and discussion only; they do not provide a diagnosis. Any clinical reference ranges should be reviewed with a qualified clinician.</div></section>`}
function reports(){return `<div class="welcome"><div><h2>Your reports, ready when you need them</h2><p>Generate a date-scoped report or export your records as CSV.</p></div></div><section class="card"><div class="card-head"><div><h3>Build a report</h3><p>Choose the report type and date range</p></div><span class="badge">CSV export</span></div><div class="form-grid"><div class="field"><label>Report type</label><select id="reportType"><option>Daily report</option><option>Month-to-date</option><option>Monthly (previous month)</option><option>Custom date range</option><option>Full history</option></select></div><div class="field"><label>Selected date</label><input id="reportDate" type="date" value="${todayISO()}" max="${todayISO()}"></div><div class="field customfield hidden"><label>Start date</label><input id="reportStart" type="date" max="${todayISO()}"></div><div class="field customfield hidden"><label>End date</label><input id="reportEnd" type="date" value="${todayISO()}" max="${todayISO()}"></div></div><div class="notice info">CSV columns: Date, Time Slot, Glucose Value (mg/dL), Created At, Updated At.</div><div class="form-actions"><button class="secondary" id="previewReport">Preview report</button><button class="primary" id="exportCsv">Export CSV ↓</button></div></section><section class="card" style="margin-top:18px"><div class="card-head"><div><h3>Report preview</h3><p id="reportSummary">Choose Preview report to display records.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Time slot</th><th>Glucose</th><th>Created at</th></tr></thead><tbody id="reportRows"><tr><td colspan="4" class="empty">No report generated yet.</td></tr></tbody></table></div></section>`}
function doctors(){const docs=[['AR','Dr. Ananya Rao','Endocrinologist','12 years experience','₹250','Every 30 days','teal'],['VK','Dr. Vikram Kumar','Diabetologist','9 years experience','₹400','Every 15 days','purple'],['SM','Dr. Sana Mehta','General Physician','7 years experience','₹600','Every 7 days','coral']];return `<div class="welcome"><div><h2>Find the right care for you</h2><p>Explore doctor profiles and choose a consultation plan that fits your needs.</p></div><div class="date-pill">✚ &nbsp; Verified status shown per profile</div></div><div class="toolbar"><h2>Available doctors</h2><div class="toolbar-actions"><input class="select" id="doctorSearch" placeholder="Search specialization…"><select class="select" id="doctorSort"><option>Recommended</option><option>Lowest price</option></select></div></div><div class="doctor-list" id="doctorList">${docs.map((d,i)=>`<article class="doctor-card" data-specialty="${d[2].toLowerCase()}"><div class="doctor-top"><div class="doctor-photo" style="background:${i===0?'#e4f5f2':i===1?'#f0edff':'#fff0eb'}">${d[0]}</div><div><h3>${d[1]}</h3><p>${d[2]} <span class="green">✓ Verified demo</span></p><p>${d[3]}</p></div></div><p>Patient-focused consultations and ongoing glucose tracking support.</p><div class="doctor-price"><div><b>${d[4]}</b><div class="small">${d[5]}</div></div><button class="primary" data-book="${i}">View plans</button></div></article>`).join('')}</div><div class="notice">Doctor names, verification labels and consultation details are illustrative prototype data, not real provider listings.</div>`}
function subscriptions(){return `<div class="welcome"><div><h2>Consultation plan</h2><p>Each fee covers the full two-calendar-month subscription, not each individual consultation.</p></div><span class="status">${state.subscription}</span></div><section class="card"><div class="card-head"><div><h3>Choose a plan</h3><p>Consultation interval determines the schedule during your subscription</p></div></div><div class="plan-grid">${[['₹250','Every 30 days','A consultation every 30 days'],['₹400','Every 15 days','A consultation every 15 days'],['₹600','Every 7 days','A consultation every 7 days']].map((p,i)=>`<div class="plan ${state.plan===i?'selected':''}"><h3>${['Essential','Regular','Frequent care'][i]}</h3><div class="price">${p[0]}</div><p><b>${p[1]}</b><br>Two-calendar-month validity<br>${p[2]}</p><button class="${state.plan===i?'primary':'secondary'}" data-plan="${i}">${state.plan===i?'Selected':'Choose plan'}</button></div>`).join('')}</div><div class="divider"></div><div class="grid layout-two"><div><h3 style="font-size:14px">Payment instructions</h3><p class="small" style="line-height:1.7">Pay the selected fee using the doctor's payment method. Then submit the transaction reference and screenshot for review. A screenshot alone does not confirm payment.</p>${state.doctorQr?`<img class="qr-preview" src="${state.doctorQr}" alt="Doctor payment QR code">`:`<div class="qr">Doctor has not uploaded a payment QR yet</div>`}${localStorage.getItem('sweetyDoctorUpi')?`<p class="small" style="text-align:center">UPI ID: ${escapeHtml(localStorage.getItem('sweetyDoctorUpi'))}</p>`:''}</div><div><h3 style="font-size:14px">Submit payment proof</h3><div class="form-grid" style="grid-template-columns:1fr"><div class="field"><label>Selected plan</label><input readonly value="${state.plan===null?'Choose a plan above':['₹250 · Every 30 days','₹400 · Every 15 days','₹600 · Every 7 days'][state.plan]}"></div><div class="field"><label>Transaction / reference ID</label><input id="txnId" placeholder="Enter payment reference"></div><div class="field"><label>Upload image (demo only)</label><input id="paymentFile" type="file" accept="image/*"></div></div><div class="notice">Status remains pending until an authorized reviewer confirms payment. This prototype does not process real payments or upload files to a server.</div><button class="primary" id="submitPayment">Submit payment proof</button></div></div></section><section class="card" style="margin-top:18px"><div class="card-head"><div><h3>Subscription status</h3><p>Current consultation access</p></div><span class="status pending" id="subStatus">Pending verification demo</span></div><div class="progress-row"><span>Plan validity</span><b>Two calendar months after activation</b></div><div class="notice info">Subscription activation and expiry are server-controlled in the real product. Chat should lock when an active subscription or approved follow-up period expires.</div></section>`}
function chatPage(){const locked=!state.chatUnlocked;const messages=state.patientChat;return `<div class="welcome"><div><h2>Messages with your doctor</h2><p>View your conversation with the authorized care team.</p></div><span class="status ${locked?'locked':''}">${locked?'Chat locked':'Access active (demo)'}</span></div><section class="card chat-layout"><div class="chat-list"><div class="card-head"><h3>Conversations</h3></div><div class="chat-person active"><div class="avatar coral">AR</div><div><b style="font-size:12px">Dr. Ananya Rao</b><div class="small">Endocrinologist</div></div></div><div class="chat-person"><div class="avatar">CT</div><div><b style="font-size:12px">Care team</b><div class="small">System messages</div></div></div></div><div class="chat-window"><div class="chat-header"><div class="avatar coral">AR</div><div><b style="font-size:12px">Dr. Ananya Rao</b><div class="small">Your consultation conversation · Demo</div></div><span style="margin-left:auto" class="status ${locked?'locked':''}">${locked?'Locked':'Authorized'}</span></div><div class="messages" id="messages">${messages.map(m=>`<div class="bubble ${m.who==='mine'?'mine':''}">${escapeHtml(m.text)}<small>${m.time}</small></div>`).join('')}</div>${locked?`<div class="notice">Your consultation access is locked. You can request a follow-up; the doctor must approve a defined access period.</div><div class="field"><label>Follow-up question</label><textarea id="followupText" rows="2" placeholder="Describe what you need help with…"></textarea></div><div class="form-actions"><button class="primary" id="followupBtn">Request follow-up</button></div>`:`<div class="chat-compose"><input id="chatInput" placeholder="Message your doctor…"><button class="primary" id="sendMessage">Send ↗</button></div>`}</div></section><div class="notice info">This prototype stores messages locally. Production messaging requires server-side authorization and persistent storage.</div>`}
function doctorChat(){const patient=state.selectedPatient||'Meera Patel';const messages=state.doctorChats[patient]||[];return `<div class="welcome"><div><h2>Patient messages</h2><p>Reply to patients with valid consultation authorization.</p></div><span class="status">Doctor account</span></div><section class="card chat-layout"><div class="chat-list"><div class="card-head"><h3>Authorized patients</h3></div>${['Meera Patel','Rahul Kumar','Anita Sharma'].map((p,i)=>`<div class="chat-person doctor-chat-person ${p===patient?'active':''}" data-chatpatient="${p}"><div class="avatar ${i===1?'coral':i===2?'teal':''}">${p.split(' ').map(x=>x[0]).join('')}</div><div><b style="font-size:12px">${p}</b><div class="small">Authorized patient · Demo</div></div></div>`).join('')}</div><div class="chat-window"><div class="chat-header"><div class="avatar teal">${patient.split(' ').map(x=>x[0]).join('')}</div><div><b style="font-size:12px">${patient}</b><div class="small">Patient conversation · Demo</div></div><span style="margin-left:auto" class="status">Authorized (demo)</span></div><div class="messages" id="messages">${messages.length?messages.map(m=>`<div class="bubble ${m.who==='mine'?'mine':''}">${escapeHtml(m.text)}<small>${m.time}</small></div>`).join(''):`<div class="empty">No messages in this conversation yet.</div>`}</div><div class="chat-compose"><input id="doctorChatInput" placeholder="Reply to ${patient}…"><button class="primary" id="doctorSendMessage">Send ↗</button></div></div></section><div class="notice info">The doctor view shows patient conversations, with the doctor's own replies aligned to the right. Demo conversations are separate from the patient account's chat.</div>`}
function notifications(){let items=state.role==='patient'?[['✓','Reading saved','Your morning fasting reading was saved successfully.','Today · 8:42 AM'],['◇','Subscription active','Your consultation plan is currently active.','Yesterday · 4:20 PM'],['▤','New message from Dr. Rao','Your doctor replied to your recent message.','Yesterday · 1:05 PM'],['◷','Reading reminder','Remember to record your after-lunch reading if it has not been saved.','Nov 8 · 1:30 PM']]:[['₹','Payment proof needs review','A patient submitted payment proof for a consultation plan.','Today · 9:10 AM'],['♙','New consultation request','A patient requested a consultation.','Today · 8:35 AM'],['▤','New patient message','You have a new message in an authorized conversation.','Yesterday · 6:10 PM'],['◷','Upcoming consultation','A consultation is scheduled for tomorrow.','Yesterday · 3:00 PM']];return `<div class="welcome"><div><h2>Notifications</h2><p>Important updates about readings, consultations, payments and messages.</p></div><button class="secondary" id="markAll">Mark all as read</button></div><section class="card"><div class="card-head"><div><h3>Recent activity</h3><p>Most recent notifications first</p></div><span class="badge">${state.notificationsRead?'All caught up':items.length+' updates'}</span></div>${items.map((x,i)=>`<div class="notif ${!state.notificationsRead&&i<2?'unread':''}"><div class="notif-icon">${x[0]}</div><div style="flex:1"><h4>${x[1]}</h4><p>${x[2]}</p><time>${x[3]}</time></div><button class="text-btn" data-notifread="${i}">${state.notificationsRead?'Read':'Mark read'}</button></div>`).join('')}</section><div class="notice info">This prototype shows example notifications. In production, notifications must be stored in PostgreSQL, scoped to the recipient, and generated by backend events or scheduled jobs.</div>`}

type.</p><div class="form-grid"><div class="field"><label>Upload payment QR code</label><input id="doctorQrUpload" type="file" accept="image/png,image/jpeg,image/webp"><small>Accepted formats: PNG, JPG, JPEG or WebP. Use a clear, valid payment QR.</small></div><div class="field"><label>UPI ID (optional)</label><input id="doctorUpi" placeholder="doctor@upi" value="${escapeHtml(localStorage.getItem('sweetyDoctorUpi')||'')}"></div></div><div style="display:flex;justify-content:center;margin:14px 0">${state.doctorQr?`<img id="doctorQrPreview" class="qr-preview" src="${state.doctorQr}" alt="Uploaded doctor payment QR code">`:`<div id="doctorQrPlaceholder" class="qr" style="margin:0;width:170px;height:170px">No QR uploaded yet</div>`}</div>`:''}<div class="form-actions"><button class="primary" id="saveProfile">Save changes</button></div></section><div class="notice">Profile edits are demonstrated locally only. QR data is saved in this browser; a production app needs secure backend storage and access controls.</div>`}
function doctorDashboard(){return `<div class="welcome"><div><h2>Good evening, Dr. Rao</h2><p>Here's your consultation activity and authorized patient overview.</p></div><div class="date-pill">▦ &nbsp; ${fmtDate(todayISO())}</div></div><div class="grid stats"><div class="card"><div class="stat-top">Authorized patients <span class="stat-icon">♙</span></div><div class="stat-number">24</div><div class="stat-note">Demo records</div></div><div class="card"><div class="stat-top">Pending requests <span class="stat-icon gold">◷</span></div><div class="stat-number">5</div><div class="stat-note">Need your review</div></div><div class="card"><div class="stat-top">Payments to review <span class="stat-icon coral">₹</span></div><div class="stat-number">3</div><div class="stat-note">Pending verification</div></div><div class="card"><div class="stat-top">Upcoming consultations <span class="stat-icon purple">◇</span></div><div class="stat-number">8</div><div class="stat-note">Next 7 days · demo</div></div></div><div class="grid layout-two"><section class="card"><div class="card-head"><div><h3>Recent authorized patient activity</h3><p>Example activity feed</p></div><button class="text-btn" data-page="patients">View patients →</button></div><div class="slots"><div class="slot"><div class="avatar">MP</div><div class="slot-copy"><b>Meera Patel</b><span>Recorded after-breakfast reading</span></div><span class="small">9:20 AM</span></div><div class="slot"><div class="avatar coral">RK</div><div class="slot-copy"><b>Rahul Kumar</b><span>Completed 4/4 readings</span></div><span class="small">8:50 AM</span></div><div class="slot"><div class="avatar teal">AS</div><div class="slot-copy"><b>Anita Sharma</b><span>Sent a follow-up request</span></div><span class="small">Yesterday</span></div></div><div class="notice info">Only patients with valid doctor-patient authorization may appear here. Names and activity are sample data.</div></section><section class="card"><div class="card-head"><div><h3>Action required</h3><p>Pending work</p></div><span class="status pending">8 items</span></div><div class="slots"><div class="slot"><div class="slot-icon">₹</div><div class="slot-copy"><b>Payment verification</b><span>3 submissions awaiting review</span></div><button class="text-btn" data-page="doctorRequests">Review</button></div><div class="slot"><div class="slot-icon">◷</div><div class="slot-copy"><b>Consultation requests</b><span>5 requests awaiting a response</span></div><button class="text-btn" data-page="doctorRequests">Open</button></div><div class="slot"><div class="slot-icon">▤</div><div class="slot-copy"><b>Patient messages</b><span>2 unread conversations</span></div><button class="text-btn" data-page="doctorChat">Reply</button></div></div></section></div>`}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function authScreen(){const signup=state.authMode==='signup',doctor=state.authRole==='doctor';return `<div class="auth-shell"><section class="auth-brand"><div class="brand" style="padding:0"><div class="logo">♥</div><span>sweety<span style="color:var(--teal)">.</span></span></div><h1>Small steps.<br>Healthier days.</h1><p>Track your glucose readings, understand your progress, and stay connected with your care team — all in one place.</p><div class="notice info" style="max-width:470px;margin-top:22px">Prototype only: demo sign-in is simulated in this browser. Do not enter a real password or medical information.</div></section><section class="auth-panel"><div class="auth-card"><div class="crumb">WELCOME TO SWEETY</div><h2 style="font-size:25px;margin:6px 0">${signup?'Create your account':'Welcome back'}</h2><p class="small">${signup?'Choose your account type to get started.':'Sign in to continue to your dedicated workspace.'}</p><div class="auth-tabs"><button type="button" data-authmode="signin" class="${!signup?'active':''}">Sign in</button><button type="button" data-authmode="signup" class="${signup?'active':''}">Sign up</button></div><div class="field"><label>Continue as</label><div class="role-choice"><label><input type="radio" name="authRole" value="patient" ${!doctor?'checked':''}> Patient</label><label><input type="radio" name="authRole" value="doctor" ${doctor?'checked':''}> Doctor</label></div></div><form id="authForm">${signup?`<div class="field"><label>Full name</label><input id="authName" required autocomplete="name" placeholder="Enter your full name"></div>`:''}<div class="field"><label>Email address</label><input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authPassword" type="password" required minlength="4" autocomplete="${signup?'new-password':'current-password'}" placeholder="${signup?'Create a password':'Enter your password'}"></div>${signup&&doctor?`<div class="field"><label>Specialization</label><input id="authSpecialty" required placeholder="e.g. Endocrinology"></div><div class="field"><label>Qualifications</label><input id="authQualifications" required placeholder="Enter qualifications"></div><div class="field"><label>Medical registration number</label><input id="authRegistration" required placeholder="Enter registration number"></div><div class="notice">Doctor details are demonstration data and must be independently verified before a real service can label a doctor verified.</div>`:''}<button type="submit" class="primary">${signup?'Create account':'Sign in as '+(doctor?'doctor':'patient')} →</button></form><div class="auth-footer">${signup?'Already have an account? Use Sign in above.':'New to Sweety? Use Sign up above.'} Your role determines which workspace appears after sign-in. This static prototype does not provide secure, server-backed authentication.</div></div></section></div>`}
function render(){if(!state.currentUser){$('.sidebar').classList.add('hidden');$('.main').classList.add('hidden');document.body.style.background='var(--bg)';let auth=$('#authRoot');if(!auth){auth=document.createElement('div');auth.id='authRoot';document.querySelector('.app').prepend(auth)}auth.classList.remove('hidden');auth.innerHTML=authScreen();bindAuth();return;}const auth=$('#authRoot');if(auth)auth.classList.add('hidden');$('.sidebar').classList.remove('hidden');$('.main').classList.remove('hidden');navRender();$('#pageTitle').textContent=titles[state.page]||'Dashboard';$('#crumbPage').textContent=titles[state.page]||'Dashboard';$('#miniName').textContent=state.currentUser.name|| (state.role==='patient'?'Chaitanya S.':'Dr. Ananya Rao');$('#miniRole').textContent=state.role==='patient'?'Patient account':'Doctor account';$('#miniAvatar').textContent=state.role==='patient'?'CS':'AR';$('#topAvatar').textContent=state.role==='patient'?'CS':'AR';const pages={dashboard,tracking,calendar:calendarPage,analytics,reports,doctors,subscriptions,chat:chatPage,notifications,profile,doctorDashboard,patients,doctorRequests,doctorChat};$('#content').innerHTML=(pages[state.page]||dashboard)();bindPage();const signout=$('#signOut');if(signout)signout.onclick=()=>{state.currentUser=null;state.page='dashboard';state.role='patient';render();};}
function bindAuth(){ $$('[data-authmode]').forEach(b=>b.onclick=()=>{state.authMode=b.dataset.authmode;render()});$$('input[name="authRole"]').forEach(r=>r.onchange=()=>{state.authRole=r.value;render()});const form=$('#authForm');if(form)form.onsubmit=e=>{e.preventDefault();const email=$('#authEmail').value.trim().toLowerCase(),password=$('#authPassword').value;let users=[];try{users=JSON.parse(localStorage.getItem('sweetyDemoUsers')||'[]')}catch{}if(state.authMode==='signup'){if(users.some(u=>u.email===email&&u.role===state.authRole)){toast('An account with this email and role already exists');return}const user={name:$('#authName').value.trim(),email,role:state.authRole,password, specialty:$('#authSpecialty')?.value||'',qualifications:$('#authQualifications')?.value||'',registration:$('#authRegistration')?.value||''};users.push(user);localStorage.setItem('sweetyDemoUsers',JSON.stringify(users));state.currentUser={name:user.name,email:user.email,role:user.role};state.role=user.role;state.page=user.role==='patient'?'dashboard':'doctorDashboard';toast('Demo account created');render();return;}const existing=users.find(u=>u.email===email&&u.password===password&&u.role===state.authRole);if(users.length&&!existing&&!email.includes('example.com')){toast('Demo account not found. Use the email and password used during sign-up.');return}state.currentUser={name:existing?.name||(state.authRole==='doctor'?'Dr. Ananya Rao':'Chaitanya Sivathmika'),email,role:state.authRole};state.role=state.authRole;state.page=state.role==='patient'?'dashboard':'doctorDashboard';toast('Signed in to '+state.role+' workspace');render();};}
function bindPage(){ $$('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));$$('[data-add]').forEach(b=>b.addEventListener('click',()=>openReading(b.dataset.date,b.dataset.add)));$$('[data-edit]').forEach(b=>b.addEventListener('click',()=>openReading(b.dataset.date,b.dataset.edit)));$$('[data-caldate]').forEach(b=>b.addEventListener('click',()=>{state.selectedDate=b.dataset.caldate;render()}));$$('[data-calprev]').forEach(b=>b.addEventListener('click',()=>{state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()-1,1);render()}));$$('[data-calnext]').forEach(b=>b.addEventListener('click',()=>{state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+1,1);if(state.calMonth>new Date(new Date().getFullYear(),new Date().getMonth(),1))state.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()}));$$('[data-today]').forEach(b=>b.addEventListener('click',()=>{state.calMonth=new Date();state.selectedDate=todayISO();render()}));$$('[data-plan]').forEach(b=>b.addEventListener('click',()=>{state.plan=Number(b.dataset.plan);render()}));$$('[data-book]').forEach(b=>b.addEventListener('click',()=>{state.plan=Number(b.dataset.book);go('subscriptions')}));$$('[data-doctortab]').forEach(b=>b.addEventListener('click',()=>{state.doctorTab=b.dataset.doctortab;$$('[data-doctortab]').forEach(x=>x.classList.toggle('active',x===b));renderRequests()}));$$('[data-review]').forEach(b=>b.addEventListener('click',()=>reviewItem(b.dataset.review)));$$('[data-viewpatient]').forEach(b=>b.addEventListener('click',()=>{toast('Opening authorized demo record for '+b.dataset.viewpatient);go('analytics')}));$$('[data-notifread]').forEach(b=>b.addEventListener('click',()=>{state.notificationsRead=true;render();toast('Notification marked as read')}));const search=$('#doctorSearch');if(search)search.addEventListener('input',()=>$$('.doctor-card').forEach(c=>c.classList.toggle('hidden',!c.dataset.specialty.includes(search.value.toLowerCase()))));const sort=$('#doctorSort');if(sort)sort.addEventListener('change',()=>{const list=$('#doctorList');[...list.children].sort((a,b)=>sort.value==='Lowest price'?parseInt(a.querySelector('.doctor-price b').textContent.replace(/\D/g,''))-parseInt(b.querySelector('.doctor-price b').textContent.replace(/\D/g,'')):0).forEach(c=>list.appendChild(c))});const type=$('#reportType');if(type)type.addEventListener('change',()=>$$('.customfield').forEach(f=>f.classList.toggle('hidden',type.value!=='Custom date range')));if($('#previewReport'))$('#previewReport').addEventListener('click',()=>makeReport(false));if($('#exportCsv'))$('#exportCsv').addEventListener('click',()=>makeReport(true));if($('#submitPayment'))$('#submitPayment').addEventListener('click',submitPayment);if($('#sendMessage'))$('#sendMessage').addEventListener('click',sendMessage);if($('#chatInput'))$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});if($('#followupBtn'))$('#followupBtn').addEventListener('click',submitFollowup);if($('#markAll'))$('#markAll').addEventListener('click',()=>{state.notificationsRead=true;render();toast('All notifications marked as read')});if($('#saveProfile'))$('#saveProfile').addEventListener('click',saveProfile);const qrInput=$('#doctorQrUpload');if(qrInput)qrInput.addEventListener('change',previewDoctorQr);if($('#doctorSendMessage'))$('#doctorSendMessage').addEventListener('click',sendDoctorMessage);if($('#doctorChatInput'))$('#doctorChatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendDoctorMessage()});$$('[data-chatpatient]').forEach(b=>b.addEventListener('click',()=>{state.selectedPatient=b.dataset.chatpatient;render()}));if($('#patientSearch'))$('#patientSearch').addEventListener('input',()=>$$('[data-patient]').forEach(r=>r.classList.toggle('hidden',!r.dataset.patient.includes($('#patientSearch').value.toLowerCase()))));if($('#dashRange'))$('#dashRange').addEventListener('change',()=>toast('Chart filter updated: '+$('#dashRange').value));if($('#analyticsRange'))$('#analyticsRange').addEventListener('change',()=>toast('Date filter selected: '+$('#analyticsRange').value));}
function openReading(date,slotId){if(date!==todayISO()){toast('Date cannot be in the past or future. Past dates are view-only.');return}const slot=slots.find(s=>s.id===slotId),r=readingFor(date,slotId);if(r&&!canEdit(r)){toast('Editing is available only within 4 hours of recording.');return}const modal=document.createElement('div');modal.style='position:fixed;inset:0;background:#17202d66;display:grid;place-items:center;padding:18px;z-index:20';modal.innerHTML=`<section class="card" style="width:min(460px,100%);box-shadow:0 25px 80px #0003"><div class="card-head"><div><h3>${r?'Edit':'Add'} ${slot.name} reading</h3><p>${fmtDate(date)} · Current date only</p></div><button class="iconbtn" id="closeModal">×</button></div><form id="readingForm"><div class="field"><label>Glucose value (mg/dL)</label><input id="glucoseValue" type="number" step="1" min="40" max="600" required placeholder="Enter a whole number" value="${r?r.value:''}"><small>Allowed range: 40–600 mg/dL, whole numbers only.</small></div><div id="readErr" class="notice error hidden"></div><div class="form-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button type="submit" class="primary">Save reading</button></div></form></section>`;document.body.appendChild(modal);const close=()=>modal.remove();$('#closeModal').onclick=close;$('#cancelModal').onclick=close;$('#readingForm').onsubmit=e=>{e.preventDefault();const raw=$('#glucoseValue').value.trim(),v=Number(raw),err=$('#readErr');let msg='';if(!raw)msg='Please enter a glucose value.';else if(!Number.isInteger(v)||v<40||v>600)msg='Value must be between 40 and 600 mg/dl.';else if(!r&&readingFor(date,slotId))msg=`You already have an ${slot.name} reading for this date.`;else if(countFor(date)>=4&&!r)msg='You can add only 4 readings per day.';if(msg){err.textContent=msg;err.classList.remove('hidden');return}state.readings[date]=state.readings[date]||{};if(r){r.value=v;r.updatedAt=Date.now()}else state.readings[date][slotId]={value:v,createdAt:Date.now(),updatedAt:Date.now()};close();render();toast(r?'Reading updated successfully':'Glucose reading saved')};}
function reportRecords(){let all=[];Object.keys(state.readings).forEach(date=>Object.entries(state.readings[date]).forEach(([id,r])=>all.push({date,slot:slots.find(s=>s.id===id).name,value:r.value,created:new Date(r.createdAt).toLocaleString('en-IN'),updated:new Date(r.updatedAt).toLocaleString('en-IN')})));const type=$('#reportType').value,selected=$('#reportDate').value||todayISO();let start='',end=selected;if(type==='Daily report')start=end=selected;else if(type==='Month-to-date'){start=selected.slice(0,7)+'-01'}else if(type==='Monthly (previous month)'){const d=new Date(selected+'T12:00:00');const p=new Date(d.getFullYear(),d.getMonth()-1,1);start=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-01`;end=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-${String(new Date(p.getFullYear(),p.getMonth()+1,0).getDate()).padStart(2,'0')}`}else if(type==='Custom date range'){start=$('#reportStart').value||selected;end=$('#reportEnd').value||selected}else{start='0000-01-01';end='9999-12-31'}const rows=all.filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>a.date.localeCompare(b.date));const parts=date=>{const d=new Date(date+'T12:00:00');return {day:d.getDate(),month:d.toLocaleDateString('en-US',{month:'short'}),year:d.getFullYear()}};const label=date=>{const p=parts(date);return `${p.day} ${p.month} ${p.year}`};const first=parts(start),last=parts(end),range=start===end?label(start):`${first.day} ${first.month}${first.year===last.year?'':` ${first.year}`} – ${last.day} ${last.month} ${last.year}`;return {rows,range}}
function makeReport(download){const {rows,range}=reportRecords();if(download){const header=['Date','Time Slot','Glucose Value (mg/dL)','Created At','Updated At'];const csv=[header,...rows.map(r=>[r.date,r.slot,r.value,r.created,r.updated])].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sweety-glucose-report.csv';a.click();URL.revokeObjectURL(url);toast('CSV exported (prototype records only)')}else{const values=rows.map(r=>r.value),summary=values.length?`Highest: ${Math.max(...values)} mg/dL · Lowest: ${Math.min(...values)} mg/dL · Average: ${(values.reduce((sum,value)=>sum+value,0)/values.length).toFixed(1)} mg/dL · ${values.length} reading(s)`:'No readings found for this date range. Highest: — · Lowest: — · Average: — · 0 readings';$('#reportSummary').textContent=`${range} · ${summary}`;$('#reportRows').innerHTML=rows.length?rows.map(r=>`<tr><td>${r.date}</td><td>${r.slot}</td><td><b>${r.value} mg/dL</b></td><td>${r.created}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No readings for this report yet. Record a glucose reading to see it here.</td></tr>';}}
function submitPayment(){const txn=$('#txnId').value.trim();if(state.plan===null){toast('Please choose a consultation plan first');return}if(!txn){toast('Please enter a payment reference ID');return}if(txn.length<5){toast('Please enter a valid reference ID');return}state.subscription='Pending';$('#subStatus').textContent='Pending verification';$('#subStatus').className='status pending';toast('Payment proof submitted. Subscription remains pending verification.');}
function sendMessage(){const input=$('#chatInput');if(!input||!input.value.trim())return;state.patientChat.push({who:'mine',text:input.value.trim(),time:timeNow()});render();const el=$('#messages');if(el)el.scrollTop=el.scrollHeight;toast('Demo message sent')}
function sendDoctorMessage(){const input=$('#doctorChatInput');if(!input||!input.value.trim())return;const patient=state.selectedPatient||'Meera Patel';state.doctorChats[patient]=state.doctorChats[patient]||[];state.doctorChats[patient].push({who:'mine',text:input.value.trim(),time:timeNow()});render();toast('Demo reply sent to '+patient)}
function previewDoctorQr(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Please choose a PNG, JPG or WebP image');e.target.value='';return}if(file.size>2*1024*1024){toast('QR image must be 2 MB or smaller');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{state.pendingDoctorQr=reader.result;const holder=$('#doctorQrPreview');if(holder){holder.src=reader.result}else{const placeholder=$('#doctorQrPlaceholder');if(placeholder)placeholder.outerHTML=`<img id="doctorQrPreview" class="qr-preview" src="${reader.result}" alt="Uploaded doctor payment QR code">`}toast('QR preview ready. Select Save changes to keep it in this browser.')};reader.readAsDataURL(file)}
function saveProfile(){if(state.role==='doctor'){if(state.pendingDoctorQr){try{localStorage.setItem('sweetyDoctorQr',state.pendingDoctorQr);state.doctorQr=state.pendingDoctorQr;state.pendingDoctorQr=''}catch(e){toast('QR image is too large for browser storage. Use a smaller image.');return}}const upi=$('#doctorUpi');if(upi)localStorage.setItem('sweetyDoctorUpi',upi.value.trim());}toast('Profile changes saved in prototype');render()}
function submitFollowup(){const text=$('#followupText').value.trim();if(!text){toast('Please enter your follow-up question');return}toast('Follow-up request submitted for doctor review');$('#followupText').value=''}
function reviewItem(i){if(state.doctorTab==='pending'){const action=prompt('Type APPROVE to confirm payment or REJECT to reject it:','APPROVE');if(!action)return;if(action.toUpperCase()==='APPROVE'){toast('Payment marked verified in prototype. Production must verify transaction first.')}else if(action.toUpperCase()==='REJECT'){const reason=prompt('Enter rejection reason:');if(reason&&reason.trim())toast('Payment rejected with reason recorded in prototype');else toast('Rejection requires a reason')}else toast('No change made')}else{const action=prompt('Type ACCEPT or REJECT for this request:','ACCEPT');if(action)toast('Request decision recorded in prototype: '+action.toUpperCase())}}
// Always start at sign-in; the dashboard is shown only after choosing and signing in to an account.
render();
